name: Android CI Bionic

on:
  push:
    branches: [ "hdroidx" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: Winlator Bionic apk
        path: ./app/build/outputs/apk/debug/app-debug.apk

    - name: Get Short SHA
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Get Version
      run: |
        FILE=""
        if [ -f "app/build.gradle.kts" ]; then
          FILE="app/build.gradle.kts"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$FILE" 2>/dev/null)
        elif [ -f "app/build.gradle" ]; then
          FILE="app/build.gradle"
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' "$FILE" 2>/dev/null)
        else
          echo "Error: Neither app/build.gradle nor app/build.gradle.kts found!"
          exit 1
        fi

        if [ -z "$VERSION" ]; then
          echo "Error: versionName not found in $FILE"
          exit 1
        fi

        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: List assets (debug)
      run: ls -la app/src/main/assets

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}-${{ env.SHORT_SHA }}
        name: Release v${{ env.VERSION }} (${{ env.SHORT_SHA }})
        body: |
          Automated debug release for version ${{ env.VERSION }}  
          Commit: ${{ github.sha }}
        draft: false
        prerelease: false
        files: ./app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
